# StickSolid · render: from a production folder in the private repo sticksolid-studio to the finished, checked video.
#   voce    (1 machine)   voice, word times, captions, time warp: catena/produci.py --fino tempi
#   frames  (6 machines)  each draws one slice of the frames (engines/stick or engines/solid, FRAME_FROM..FRAME_TO)
#   finale  (1 machine)   joins the slices, then mix, sounds (Real SFX), closing card, cover, contact sheet, checks
# The heavy work runs here, in the public repository, where GitHub's minutes are free; the Claude routines only write
# the script and the scenes (lesson 2 of the guide). Every stage is saved as an artifact as soon as it is ready.
#
# Needs one secret, created by the user: STUDIO_READ_TOKEN, a fine-grained token with read-only access ("Contents:
# read") to sticksolid-studio. The production is read with it and never written back.
# The finished video stays an artifact (14 days) and goes into a DRAFT release (private: only readable with a token), from
# which the Office (the StickSolid Studio Worker) shows it in Approva and publishes it.
# The Office hears about every stage through catena/ufficio.py, with two more secrets: OFFICE_URL and STUDIO_SECRET
# (without them the render works the same and only the Office stays quiet).
#
# Start: Actions -> render -> Run workflow (video = the production id, e.g. storia-1),
#        or a repository_dispatch of type "render" with {"video": "storia-1"} (the routines and the new Office).
name: render

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Production id in sticksolid-studio/productions (e.g. storia-1)"
        required: true
  repository_dispatch:
    types: [render]

concurrency:
  group: render-${{ inputs.video || github.event.client_payload.video }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VIDEO: ${{ inputs.video || github.event.client_payload.video }}
  STUDIO_REPO: ${{ github.repository_owner }}/sticksolid-studio
  STICKSOLID_KIT: ${{ github.workspace }}/render/skills/kit
  REAL_SFX: ${{ github.workspace }}/studio/skills-esterne/real-sfx
  SLICES: 6
  OFFICE_URL: ${{ secrets.OFFICE_URL }}
  STUDIO_SECRET: ${{ secrets.STUDIO_SECRET }}

jobs:
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      frames: ${{ steps.frames.outputs.n }}
      who: ${{ steps.frames.outputs.who }}
    steps:
      - name: Which video
        run: |
          echo "$VIDEO" | grep -Eq '^[a-z0-9][a-z0-9-]{0,60}$' || { echo "id del video non valido: '$VIDEO'"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: render
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STUDIO_REPO }}
          token: ${{ secrets.STUDIO_READ_TOKEN }}
          path: studio
          sparse-checkout: |
            productions/${{ env.VIDEO }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (a recent static build, like the PC's; retries and a spare source)
        run: bash render/catena/ci_ffmpeg.sh
      - name: Voice models cache
        uses: actions/cache@v4
        with:
          path: render/skills/kit/models
          key: kit-models-v1
      - name: Kit (Kokoro, Parakeet, Praat)
        run: |
          bash render/skills/kit/setup.sh --voice
          render/skills/kit/.venv/bin/pip install -q praat-parselmouth
      - name: Tell the Office the video starts
        run: python3 render/catena/ufficio.py "studio/productions/$VIDEO" inizio
      - name: Voce, parole, didascalie, tempi
        run: set -o pipefail; cd render && "$STICKSOLID_KIT/.venv/bin/python" -u catena/produci.py "../studio/productions/$VIDEO" --fino tempi
      - name: Tell the Office the voice is done
        run: |
          python3 render/catena/ufficio.py "studio/productions/$VIDEO" reparto voce done "Voce pronta, con la regia"
          python3 render/catena/ufficio.py "studio/productions/$VIDEO" reparto render working "Sei macchine disegnano i fotogrammi"
      - name: How many frames
        id: frames
        run: |
          P="studio/productions/$VIDEO"
          echo "n=$(python3 -c "import json;print(round(json.load(open('$P/project/catena.json'))['duration']*30))")" >> "$GITHUB_OUTPUT"
          echo "who=$(python3 -c "import json;print(json.load(open('$P/meta.json'))['who'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: voce
          path: |
            studio/productions/${{ env.VIDEO }}/project/catena.json
            studio/productions/${{ env.VIDEO }}/out
          retention-days: 3

  frames:
    needs: voce
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        slice: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: render
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STUDIO_REPO }}
          token: ${{ secrets.STUDIO_READ_TOKEN }}
          path: studio
          sparse-checkout: |
            productions/${{ env.VIDEO }}
      - uses: actions/download-artifact@v4
        with:
          name: voce
          path: studio/productions/${{ env.VIDEO }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg (a recent static build, like the PC's; retries and a spare source)
        run: bash render/catena/ci_ffmpeg.sh
      - name: three.js, Playwright and Chromium (at most 4 minutes a try, 3 tries; a machine once hung here for half an hour)
        timeout-minutes: 14
        run: |
          cd render/skills/kit && npm install --silent --no-audit --no-fund
          for n in 1 2 3; do timeout 240 npx --yes playwright install --with-deps chromium >/dev/null && exit 0; echo "Chromium: tentativo $n non riuscito"; done; exit 1
      - name: Slice ${{ matrix.slice }}
        env:
          N: ${{ needs.voce.outputs.frames }}
          WHO: ${{ needs.voce.outputs.who }}
          GL: swiftshader
        run: |
          export FRAME_FROM=$(( N * ${{ matrix.slice }} / SLICES )) FRAME_TO=$(( N * (${{ matrix.slice }} + 1) / SLICES ))
          echo "fotogrammi $FRAME_FROM-$FRAME_TO di $N ($WHO)"
          mkdir -p segs
          node "render/engines/$WHO/render.mjs" "studio/productions/$VIDEO/project" video "segs/seg_${{ matrix.slice }}.mp4" 30
      - name: Tell the Office this machine has finished
        run: python3 render/catena/ufficio.py "studio/productions/$VIDEO" fetta ${{ matrix.slice }}
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.slice }}
          path: segs/seg_${{ matrix.slice }}.mp4
          retention-days: 3

  finale:
    needs: [voce, frames]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write          # the draft release with the finished video
    steps:
      - uses: actions/checkout@v4
        with:
          path: render
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STUDIO_REPO }}
          token: ${{ secrets.STUDIO_READ_TOKEN }}
          path: studio
          sparse-checkout: |
            productions/${{ env.VIDEO }}
            identita/chiusura
            skills-esterne/real-sfx
      - uses: actions/download-artifact@v4
        with:
          name: voce
          path: studio/productions/${{ env.VIDEO }}
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: segs
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (a recent static build, like the PC's; retries and a spare source)
        run: bash render/catena/ci_ffmpeg.sh
      - name: Voice models cache
        uses: actions/cache@v4
        with:
          path: render/skills/kit/models
          key: kit-models-v1
      - name: Kit, Chromium (cover), Real SFX
        run: |
          bash render/skills/kit/setup.sh --voice
          render/skills/kit/.venv/bin/pip install -q praat-parselmouth
          (cd render/skills/kit && npx --yes playwright install --with-deps chromium >/dev/null)
          python3 render/catena/ci_suoni.py "$REAL_SFX" render
      - name: Join the slices
        run: |
          O="studio/productions/$VIDEO/out"; mkdir -p "$O"
          for i in $(seq 0 $((SLICES - 1))); do echo "file '$PWD/segs/seg_$i.mp4'"; done > segs/list.txt
          ffmpeg -y -v error -f concat -safe 0 -i segs/list.txt -c copy "$O/muto.mp4"
      - name: Tell the Office the sounds are at work
        run: python3 render/catena/ufficio.py "studio/productions/$VIDEO" reparto suoni working "I suoni sulle parole, la chiusura, il controllo"
      - name: Mix, suoni, finale, copertina, provini, controllo
        run: |
          set -o pipefail                                  # an error in the chain must fail the job, not get lost in tee
          cd render
          "$STICKSOLID_KIT/.venv/bin/python" -u catena/produci.py "../studio/productions/$VIDEO" --da mix | tee ../controllo.log
          grep -q "CONTROLLO: passa" ../controllo.log || echo "::warning::il controllo qualità non passa, vedi controllo.json"
      - name: The draft release (private until Approva), and the video to Approva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          O="studio/productions/$VIDEO/out"; TAG="video-$VIDEO-${{ github.run_id }}"
          gh release create "$TAG" --draft --repo "${{ github.repository }}" --title "$VIDEO (bozza, da approvare)" \
            --notes "Fatto da render.yml, run ${{ github.run_id }}. Bozza privata: diventa pubblica solo dopo Approva." \
            "$O/$VIDEO.mp4" "$O/copertina.png" "$O/provini.jpg" "$O/controllo.json"
          python3 render/catena/ufficio.py "studio/productions/$VIDEO" reparto suoni done "Suoni e chiusura pronti"
          python3 render/catena/ufficio.py "studio/productions/$VIDEO" pronto "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.VIDEO }}
          path: |
            studio/productions/${{ env.VIDEO }}/out/${{ env.VIDEO }}.mp4
            studio/productions/${{ env.VIDEO }}/out/copertina.png
            studio/productions/${{ env.VIDEO }}/out/provini.jpg
            studio/productions/${{ env.VIDEO }}/out/controllo.json
            studio/productions/${{ env.VIDEO }}/out/regia.json
            studio/productions/${{ env.VIDEO }}/out/sfx/critica.md
          retention-days: 14

  # something stopped: the Office shows a red card and sends a notification
  fermo:
    needs: [voce, frames, finale]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read            # to read the log of the job that failed, for the Regista's explanation
    steps:
      - uses: actions/checkout@v4
        with:
          path: render
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STUDIO_REPO }}
          token: ${{ secrets.STUDIO_READ_TOKEN }}
          path: studio
          sparse-checkout: |
            productions/${{ env.VIDEO }}
      - name: Tell the Office where it stopped, and why
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STEP=${{ needs.voce.result != 'success' && 'voce' || needs.frames.result != 'success' && 'frames' || 'finale' }}
          gh run view ${{ github.run_id }} --repo "${{ github.repository }}" --log-failed > errore.log 2>/dev/null || true
          python3 render/catena/ufficio.py "studio/productions/$VIDEO" fermo "$STEP" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" errore.log

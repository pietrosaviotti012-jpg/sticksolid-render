<!doctype html>
<html><head><meta charset="utf-8"><title>chiusura</title>
<style>@font-face{font-family:Poppins;font-weight:700;src:url(lib/Poppins-Bold.ttf)}html,body{margin:0;background:#888}#c{display:block}body>canvas:not(#c){display:none}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib/lib.js"></script><script src="lib/chars.js"></script><script src="lib/moves-stick.js"></script>
<script type="module">
// The StickSolid closing card (2.8 s, 1080x1920). The signature: Stick and Solid slide in, Solid raises his fist,
// Stick's fist meets it exactly (his arm follows Solid's fist frame by frame), a star bursts with the signature
// sound, then they wave while the call to action and @sticksolid pop in.
// window.renderChiusura({ t, cta }) -> PNG.  window.CHIUSURA_TIMES: when each sound goes, for the mix.
import './man.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, YEL = '#ffc93c';
const T = { swishStick: 0.0, swishSolid: 0.12, reach: 0.5, bump: 0.85, pop: 1.05, wave: 1.45, end: 2.8 };
window.CHIUSURA_TIMES = T;
const c01 = (v) => Math.max(0, Math.min(1, v));
const DRAW = 1500 / 1600;                     // Solid's 1600 px picture drawn 1500 px wide
const HEAD_S = [790, 720], HEAD_K = [235, 720]; // where the two heads sit at rest (page pixels)
const S_STICK = 560;                          // Stick's size: his head matches Solid's
const STICK = { hat: 'none', belt: false, cols: ['#e0392f', '#e0392f'], legW: 2.2, armW: 1.4, headScale: 0.78, s: S_STICK };
const CAM = { fov: 21, camPos: [0, 1.38, 4.6], camLook: [0, 1.3, 0], ground: false, shirt: '#2f63c9', turn: -0.3, pose: 'stand' };
const SMILE = { brow: 0.6, tilt: 0.7, lid: 0.8, mouth: 'smile', eyes: 1.35 }, LAUGH = { brow: 0.9, tilt: 0.8, lid: 0.15, mouth: 'smile', grin: 1.2, eyes: 1.35 };
const lerp3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

window.renderChiusura = ({ t = 0, cta = 'FOLLOW FOR MORE' } = {}) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sh = t > T.bump && t < T.bump + 0.18 ? shake(t, 9 * (1 - (t - T.bump) / 0.18), 3) : [0, 0];
  ctx.translate(sh[0], sh[1]);
  ctx.fillStyle = YEL; ctx.fillRect(-20, -20, W + 40, 1960);
  circle(ctx, 520, 820, 380 + 60 * backOut(c01((t - T.bump) / 0.35))); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();

  // how far the fists have come up (0 rest .. 1 the bump), and down again before the wave
  const reach = backOut(c01((t - T.reach) / (T.bump - T.reach))) * (1 - c01((t - T.wave + 0.1) / 0.2));
  const wv = t > T.wave ? Math.sin((t - T.wave) * Math.PI * 4) : 0, waving = t > T.wave;

  // ---- Solid: slides in from the right, raises his right fist towards Stick ----
  const inS = backOut(c01((t - T.swishSolid) / 0.35)), slideS = (1 - inS) * 700;
  const pose = {
    rSh: lerp3([0, 0, -0.12], [-0.55, 0, -1.2], reach), rEl: lerp3([-0.15, 0, 0], [0, 0, -1.75], reach),
    lSh: [0, 0, 0.12], lEl: [-0.15, 0, 0],
  };
  const solid = window.renderManCanvas({ ...CAM, poseExtra: pose, face: t > T.bump ? LAUGH : SMILE });
  const F = window.lastFists, ox = HEAD_S[0] - F.head[0] * DRAW + slideS, oy = HEAD_S[1] - F.head[1] * DRAW;
  ctx.drawImage(solid, ox, oy, 1600 * DRAW, 1600 * DRAW);
  const fist = [ox + F.r[0] * DRAW, oy + F.r[1] * DRAW];

  // ---- Stick: slides in from the left; his right hand goes to Solid's fist ----
  const inK = backOut(c01((t - T.swishStick) / 0.35)), kx = HEAD_K[0] - (1 - inK) * 600;
  const feet = HEAD_K[1] + (0.575 + 0.19 * 0.78) * S_STICK;
  const restHand = [0.18, -0.29];                                        // idle hand, in Stick's own units
  const target = [(fist[0] - kx) / S_STICK, (fist[1] - feet) / S_STICK];
  const hand = lerp3(restHand, target, reach);
  const arms = { L: waving ? [2.15, -0.45 + 0.4 * wv] : [0.3, -0.12], R: { ik: hand, bend: -1 } };
  drawStick(ctx, { ...STICK, x: kx, y: feet, arms, legs: { L: [0.1, -0.04], R: [0.1, -0.04] }, headTilt: 0.05,
    face: t > T.bump ? { eyes: 'happy', mouth: 'grin' } : { mouth: 'smile', look: [0.7, -0.2] }, blush: t > T.bump });

  // ---- the bump: a star burst on the fists ----
  const bt = t - T.bump;
  if (bt > 0 && bt < 0.45) {
    const k = c01(bt / 0.45), r = 60 + 140 * easeOut(k);
    ctx.save(); ctx.globalAlpha = 1 - k;
    burst(ctx, fist[0], fist[1], r, 12, '#fff8d0', 7, 0.5); star5(ctx, fist[0], fist[1], 34 * (1 - k) + 18, k * 2, '#ffe14d');
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + 0.3; sparkle(ctx, fist[0] + Math.cos(a) * r * 1.25, fist[1] + Math.sin(a) * r * 1.25, 16 * (1 - k), 1); }
    ctx.restore();
  }

  // ---- text ----
  const pc = backOut(c01((t - T.pop) / 0.3));
  if (pc > 0) {
    ctx.save(); ctx.translate(W / 2, 380); ctx.scale(pc, pc); ctx.rotate(-0.03);
    ctx.font = '700 64px Poppins'; const tw = ctx.measureText(cta).width + 90;
    rrect(ctx, -tw / 2, -62, tw, 124, 62); ctx.fillStyle = '#221c22'; ctx.fill();
    text(ctx, cta, 0, 2, 64, YEL, null, 0); ctx.restore();
  }
  const ph = backOut(c01((t - T.pop - 0.15) / 0.3));
  if (ph > 0) {
    ctx.save(); ctx.translate(W / 2, 1700); ctx.scale(ph, ph);
    text(ctx, '@sticksolid', 0, 0, 96, '#fff', '#221c22', 16); text(ctx, '@sticksolid', 0, 0, 96, '#fff', null, 0); ctx.restore();
  }
  return cv.toDataURL('image/png');
};
document.fonts.load('700 40px Poppins').then(() => { const w = () => window.manReady ? (window.chiusuraReady = true) : setTimeout(w, 50); w(); });
</script></body></html>
